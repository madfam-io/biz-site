name: Public Hygiene

# madfam-site is a public repository. These two guards are the CI half of the
# repo-boundary contract; docs/PUBLIC_REPO_BOUNDARY.md is the human half.
#
# paths: '**' is deliberate. public-hygiene-check.sh scans every tracked TEXT
# file, so a filter narrowed to doc globs would under-trigger the very scan that
# was widened to catch a credential in a .npmrc, a .yml or a .ts.

on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: boundary-checkpoint-check.sh diffs against origin/main,
          # and a shallow checkout makes it fall back to a narrower comparison.
          fetch-depth: 0

      - name: Check public repository hygiene
        run: bash ./scripts/public-hygiene-check.sh

      - name: Check boundary checkpoints
        run: bash ./scripts/boundary-checkpoint-check.sh

      - name: Public hygiene guard self-test
        run: bash ./scripts/tests/test-public-hygiene.sh
